<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Modules Assignment</title>
</head>
<body>

    <h1>JavaScript Modules Demo</h1>

    <button id="loadBtn">
        Load Calculator Dynamically
    </button>

    <script type="module" src="main.js"></script>

    <script type="module">
        document.getElementById("loadBtn")
            .addEventListener("click", async () => {

                const calculatorModule =
                    await import('./calculator.js');

                console.log("Dynamic Import:");

                console.log(
                    calculatorModule.add(50, 25)
                );

                console.log(
                    calculatorModule.multiply(5, 5)
                );
            });
    </script>

</body>
</html>
