<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="100%" height="100%" fill="#FAF9F6"/>
  <!-- Minimalist Backpack Frame -->
  <rect x="290" y="270" width="220" height="300" rx="45" 
        fill="none" 
        stroke="#B45309" 
        stroke-width="8" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>
  <!-- Front pocket -->
  <rect x="330" y="420" width="140" height="110" rx="18" 
        fill="none" 
        stroke="#B45309" 
        stroke-width="8" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>
  <!-- Handle Loop -->
  <path d="M 360,270 C 360,225 440,225 440,270" 
        fill="none" 
        stroke="#B45309" 
        stroke-width="8" 
        stroke-linecap="round"/>
  <!-- Design straps -->
  <line x1="345" y1="270" x2="345" y2="420" stroke="#B45309" stroke-width="8" stroke-linecap="round"/>
  <line x1="455" y1="270" x2="455" y2="420" stroke="#B45309" stroke-width="8" stroke-linecap="round"/>
  <!-- Zip pull tags -->
  <circle cx="400" cy="420" r="6" fill="#B45309"/>
</svg>
